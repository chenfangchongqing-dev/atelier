<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="description" content="翻译项目管理与本地化工作坊：城市政务与文旅外宣网站翻译流程。">
  <link rel="preload" as="image" href="../assets/city_translation_workflow.webp">
  <title>城市政务与文旅外宣网站翻译流程｜工作坊</title>
  <style>
    :root{--paper:#f8f7f2;--ink:#203f34;--muted:#66796c;--line:#dce5dc;--green:#28543c}
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    body{background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
    .page{width:100%;height:100dvh;min-height:450px;display:flex;flex-direction:column;padding:12px clamp(12px,2vw,32px) 10px;gap:8px}
    .visual{flex:1;min-height:0;margin:0;display:flex;align-items:center;justify-content:center}
    .visual img{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px;box-shadow:0 12px 44px rgba(29,60,46,.10)}
    .nav{flex:0 0 auto;min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .nav a{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:8px 14px;font-size:15px;font-weight:650;line-height:1.35;text-decoration:none;border-radius:999px;transition:background .16s,color .16s,transform .16s}
    .back{color:var(--muted);background:transparent;border:1px solid var(--line)}
    .back:hover{background:#edf1e9;color:var(--ink)}
    .next{color:#fff;background:var(--green);border:1px solid var(--green)}
    .next:hover{background:#1b412e;transform:translateX(2px)}
    .nav a:focus-visible{outline:3px solid #c59e6a;outline-offset:3px}
    @media(max-width:650px){.page{min-height:100dvh;padding:12px 9px;gap:8px}.visual img{border-radius:7px}.nav{min-height:48px}.nav a{font-size:13px;padding:8px 11px}}
    @media print{.page{height:100vh;min-height:0;padding:0}.nav{display:none}.visual img{box-shadow:none;border-radius:0}}
  </style>
</head>
<body>
  <main class="page">
    <figure class="visual">
      <img src="../assets/city_translation_workflow.webp" width="1673" height="940" fetchpriority="high" alt="城市政务与文旅外宣网站翻译流程：需求与多模态盘点、译前工程与标准库、政务及文旅两条翻译路径、地图与多媒体排版、测试服务机质检、终审交付与结算运维。">
    </figure>
    <nav class="nav" aria-label="课堂教学环节切换">
      <a class="back" href="../lecture/#10">← 返回知识讲解</a>
      <a class="next" href="../wechat/">进入微信群情境 <span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
