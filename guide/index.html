<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f1">
<meta name="description" content="翻译项目管理与本地化系列工作坊（三）· 自动循环播放的专业术语快闪游戏。">
<title>专业术语快闪｜翻译项目管理工作坊</title>
<style>
:root{--paper:#f7f6f1;--ink:#1c4335;--muted:#758b7b;--line:#dae4d9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
body{background:radial-gradient(ellipse 84% 80% at 50% 48%,#fffefa,#f7f6f1 78%);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:focus-visible{outline:3px solid #b8916a;outline-offset:4px}
.page{min-height:100dvh;width:min(100% - 80px,1450px);margin:auto;display:flex;flex-direction:column}
.topbar{min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:14px;font-weight:750;font-size:17px}
.brand-mark{display:grid;place-items:center;background:#244d39;color:white;width:38px;height:38px;border-radius:12px;font-weight:800}
.back{color:#778b7c;font-size:15px;white-space:nowrap}.back:hover{color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:25px 0 32px;text-align:center}
.eyebrow{font-size:15px;font-weight:800;letter-spacing:.21em;color:#b08a6a}
h1{font-size:clamp(37px,4.35vw,66px);line-height:1.25;letter-spacing:-.045em;font-weight:780;margin:13px 0 10px}
.intro{color:#829589;font-size:clamp(17px,1.55vw,23px);margin:0 0 32px}
.deck{position:relative;width:min(920px,100%);height:clamp(285px,38vh,400px);margin-bottom:24px}
.layer{position:absolute;border:1px solid #d4dfd2;border-radius:28px;background:#e5ece3;top:20px;bottom:-13px;left:6%;right:6%;opacity:.75}
.layer.two{top:11px;bottom:-5px;left:3%;right:3%;background:#eef2e8}
.card{position:absolute;inset:0;overflow:hidden;border-radius:28px;border:1px solid #cedccf;background:linear-gradient(135deg,#fffefa 10%,#f2f5ee 100%);box-shadow:0 24px 70px rgba(29,66,42,.09);isolation:isolate}
.card::before{position:absolute;content:"";height:6px;left:0;right:0;top:0;background:linear-gradient(90deg,#244e3b,#7c9e80 65%,#c3a075)}
.card.alt{background:linear-gradient(135deg,#edf4eb 0%,#e6eee4 100%)}
.card.dark{background:linear-gradient(135deg,#285443 0%,#1c4437 100%);border-color:#26523f;color:#fff}
.card.dark::before{background:linear-gradient(90deg,#bb9d76,#c9dcbc)}
.corner{position:absolute;left:29px;top:27px;font-size:13px;font-weight:750;letter-spacing:.17em;color:#9bac9c}
.card.dark .corner,.card.dark .counter{color:#bbd2bd}
.counter{position:absolute;right:29px;top:27px;font-size:16px;font-weight:730;color:#7e9884;font-variant-numeric:tabular-nums}
.slot{position:absolute;inset:0;overflow:hidden}
.word{position:absolute;inset:0;display:grid;place-items:center;padding:40px 28px 20px;opacity:0;transform:translateY(85%) scale(.92);filter:blur(5px);transition:transform .48s cubic-bezier(.2,.84,.32,1),opacity .28s ease,filter .25s ease;will-change:transform,opacity}
.word.visible{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
.word.outgoing{opacity:0;transform:translateY(-87%) scale(.95);filter:blur(5px)}
.word span{font-weight:800;font-size:clamp(95px,11vw,170px);letter-spacing:-.045em;line-height:1.12;overflow-wrap:anywhere}
.word span.zh{font-size:clamp(64px,7vw,121px);letter-spacing:.015em}
.word span.long{font-size:clamp(57px,6.25vw,106px)}
.dots{height:7px;display:flex;gap:7px;justify-content:center;align-items:center;margin:14px 0 15px}
.dots i{height:5px;width:24px;display:block;background:#dce7dc;border-radius:6px;transition:background .15s,transform .15s}
.dots i.on{background:#4d8260;transform:scaleY(1.35)}
.caption{font-size:16px;color:#94a398;letter-spacing:.035em}
.footer{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:91px;border-top:1px solid var(--line)}
.small{font-size:14px;color:#8a9b8e}
.next{display:inline-flex;align-items:center;gap:14px;justify-content:center;border-radius:100px;background:#28573e;color:white;padding:14px 28px;font-size:19px;font-weight:780;min-height:54px;box-shadow:0 11px 25px rgba(25,69,41,.14);transition:background .17s}
.next:hover{background:#183e2c}
@media(max-width:700px){.page{width:calc(100% - 34px)}.topbar{min-height:73px}.brand{font-size:12px;gap:8px}.brand-mark{width:32px;height:32px}.back{font-size:12px}.eyebrow{font-size:12px}h1{margin:9px 0}.intro{font-size:16px;margin-bottom:23px}.deck{height:33vh;min-height:235px}.corner{left:19px;top:20px;font-size:11px}.counter{right:19px;top:20px;font-size:12px}.word span{font-size:clamp(68px,15vw,100px)}.word span.zh{font-size:clamp(49px,10vw,74px)}.word span.long{font-size:clamp(39px,8.3vw,60px)}.footer{min-height:90px;gap:12px}.small{font-size:12px}.next{font-size:15px;padding:12px 17px}.dots{gap:5px}.dots i{width:13px}}
@media(prefers-reduced-motion:reduce){.word{transition:opacity .14s ease;transform:none!important;filter:none!important}.word.outgoing{transform:none}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">译</span><span>翻译项目管理与本地化系列工作坊（三）</span></div>
    <a class="back" href="../">← 活动签到</a>
  </header>
  <main>
    <p class="eyebrow">TERMINOLOGY · FLASH CARDS</p>
    <h1>行业术语快闪</h1>
    <p class="intro">看到这个词，你会想到什么？</p>
    <div class="deck" aria-label="专业术语自动轮播">
      <div class="layer"></div><div class="layer two"></div>
      <div class="card" id="card">
        <span class="corner">TRADUCTION & LOCALISATION</span>
        <span class="counter" id="counter">01 / 16</span>
        <div class="slot" id="slot" aria-live="off"></div>
      </div>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <p class="caption">自动循环 · 术语辨认</p>
  </main>
  <footer class="footer">
    <span class="small">PART 01 · WARM-UP</span>
    <a class="next" href="../lecture/">进入知识讲解 <span aria-hidden="true">→</span></a>
  </footer>
</div>
<script>
(() => {
  "use strict";
  const terms=["LSP","本地化","QA","质量工程师","PM","TPM","TB","TM","MAO","CAT","TMS","语言资产","爆框","回填","伪翻译测试","In-Context"];
  const slot=document.getElementById("slot");
  const card=document.getElementById("card");
  const counter=document.getElementById("counter");
  const dots=document.getElementById("dots");
  const hold=1780;
  let index=0, shown=null, sequence=0;
  for(let i=0;i<terms.length;i++){const d=document.createElement("i");dots.appendChild(d)}
  function next(){
    const current=sequence++;
    const value=terms[index];
    const idx=index;
    index=(index+1)%terms.length;
    const panel=document.createElement("div");
    panel.className="word";
    const span=document.createElement("span");
    span.textContent=value;
    if(/[\u3400-\u9fff]/.test(value))span.classList.add("zh");
    if(value.length>=7)span.classList.add("long");
    panel.appendChild(span);
    slot.appendChild(panel);
    const previous=shown;
    shown=panel;
    card.classList.toggle("alt",idx%3===1);
    card.classList.toggle("dark",idx%3===2);
    counter.textContent=String(idx+1).padStart(2,"0")+" / "+String(terms.length).padStart(2,"0");
    for(let j=0;j<dots.children.length;j++)dots.children[j].classList.toggle("on",j===idx);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{if(sequence===current+1)panel.classList.add("visible")}));
    if(previous){previous.classList.remove("visible");previous.classList.add("outgoing");setTimeout(()=>previous.remove(),540)}
  }
  next();
  setInterval(next,hold);
})();
</script>
</body>
</html>
